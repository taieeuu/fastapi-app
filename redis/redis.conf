################################# 基本設定 #################################

# 監聽所有網路接口、設定埠號
bind 0.0.0.0
port 6379

# 啟用保護模式（預設 yes，若部署於內網可設為 no）
protected-mode yes

# 訪問密碼（請務必改成強密碼）
requirepass pk_redis@6620

################################ 持久化設定 ################################

# RDB 快照
save 900 1
save 300 10
save 60 10000
dir /var/lib/redis-stack
dbfilename dump.rdb

# AOF
appendonly yes
appendfilename "appendonly.aof"
# AOF 重寫觸發條件：檔案大小成長到初始大小的 100% 時
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

################################ 日誌設定 ##################################

# 日誌檔案路徑（容器內的掛載路徑）
logfile "/var/log/redis/redis.log"
# 日誌等級：debug, verbose, notice, warning
loglevel notice

################################ 資源限制 ##################################

# 最大同時連線數
maxclients 1000

# 在記憶體使用達到限制時，淘汰策略
# noeviction: 不淘汰，直接拒絕寫入
# allkeys-lru: LRU 淘汰所有鍵
maxmemory 1gb
maxmemory-policy allkeys-lru

################################ 模組載入 ##################################

# 若你需要手動載入模組，可取消下面註解並調整路徑
# Redis Stack 已內建多數模組，通常不必手動載入。
# loadmoduleis-stack/lib/redisearch.so
# loadmodule /opt/redis-stack/lib/redistimeseries.so
# loadmodule /opt/redis-stack/lib/redisbloom.so
# loadmodule /opt/redis-stack/lib/rejson.so
# loadmodule /opt/redis-stack/lib/redisgears.so v8-plugin-path /opt/redis-stack/lib/libredisgears_v8_plugin.so

################################ 其他進階設定 ################################

# 開啟 AOF 同步寫入（always, everysec, no）
# appendfsync everysec

# 启用集群模式（如無需集群可保持預設 no）
# cluster-enabled no

# include 其他設定檔
# include /usr/local/etc/redis/conf.d/*.conf
